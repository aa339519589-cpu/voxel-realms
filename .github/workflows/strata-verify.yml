name: Verify STRATA WebGL
on:
  push:
    branches: [strata-world-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: |
          python3 -m http.server 9000 >/tmp/strata-http.log 2>&1 &
          sleep 1
          node strata-world/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strata-browser-screenshots
          path: /tmp/strata-*.png
